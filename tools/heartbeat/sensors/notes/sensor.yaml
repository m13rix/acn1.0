name: notes
description: >
  Obsidian vault heartbeat sensor for local Markdown notes and attachments.
events:
  - name: newNote
    description: Fires when a new Markdown note file appears in the Obsidian vault after a 5-minute retriggerable edit debounce.
    argsSchema:
      type: array
      items: []
      minItems: 0
      maxItems: 0
    payloadSchema:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        title:
          type: string
        path:
          type: string
        relativePath:
          type: string
        contents:
          type: string
        createdAt:
          type: string
        modifiedAt:
          type: string
      required:
        - id
        - name
        - title
        - path
        - relativePath
        - contents
        - createdAt
        - modifiedAt

  - name: noteUpdated
    description: Fires when an existing Markdown note file is updated after a 5-minute retriggerable edit debounce.
    argsSchema:
      type: array
      items: []
      minItems: 0
      maxItems: 0
    payloadSchema:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        title:
          type: string
        path:
          type: string
        relativePath:
          type: string
        contents:
          type: string
        createdAt:
          type: string
        modifiedAt:
          type: string
      required:
        - id
        - name
        - title
        - path
        - relativePath
        - contents
        - createdAt
        - modifiedAt

  - name: newAttachment
    description: Fires when a new non-Markdown file appears in the Obsidian vault.
    argsSchema:
      type: array
      items: []
      minItems: 0
      maxItems: 0
    payloadSchema:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        path:
          type: string
        relativePath:
          type: string
        mimeType:
          type: string
        createdAt:
          type: string
        modifiedAt:
          type: string
        size:
          type: number
      required:
        - id
        - name
        - path
        - relativePath
        - mimeType
        - createdAt
        - modifiedAt
        - size
