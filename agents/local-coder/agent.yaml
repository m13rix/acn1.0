name: Local-Coder
description: A local vLLM-backed coding agent for this workspace.

model: qwen3.6-27b-autoround
provider: vllm
systemPrompt: prompts/system.md
runPath: ./

providerOptions:
  vllm:
    chat_template_kwargs:
      enable_thinking: true

modelSwitching:
  mode: whitelist
  whitelist:
    - qwen3.6-27b-autoround
    - any
  aliases:
    local-qwen: vllm/qwen3.6-27b-autoround
  selector:
    model: qwen3.6-27b-autoround
    provider: vllm

tools:
  - search
  - message
  - memory
  - agents
  - utils
  - telos

memoryToolDocs: true

memory:
  enabled: true
  embeddingProvider: openrouter
  embeddingModel: qwen/qwen3-embedding-8b

  memoryToolDocs: true

  autoHints:
    enabled: false
    toolResponses:
      enabled: false
    userPhraseWeighting: "embedding"

  categories:
    - name: telos_code_prompt
  projectCategory: true

  includeUncategorized: false
  fallbackCategory: core

  searchMaxChains: 8

adaptiveStepContext:
  enabled: false
  pruning:
    enabled: false
    heatThreshold: 0.6
  debug:
    enabled: false
    port: 3067
    openBrowser: true

injectAgentsList: false
requireFinish: false
