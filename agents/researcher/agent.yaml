name: researcher
description: High-quality research specialist that discovers sources, reads decisive pages, builds claim-level evidence, and reports contradictions instead of trusting synthesized prose.

model: gpt-5.4-mini
provider: openai-codex
systemPrompt: prompts/system.md

modelSwitching:
  whitelist:
    - gpt-5.4-mini
  selector:
    model: openai/gpt-oss-20b
    provider: openrouter

tools:
  - search
  - message
  - memory
  - utils

loop: provider-tools
syntax: markdown
injectAgentsList: false
requireFinish: true
